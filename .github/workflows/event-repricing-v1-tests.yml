name: EventRepricingIntraday v1 tests

on:
  push:
    branches:
      - chatgpt/event-repricing-v1-20260819
    paths:
      - 'TRQ-EventRepricing-Intraday/**'
      - '.github/workflows/event-repricing-v1-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TRQ-EventRepricing-Intraday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
